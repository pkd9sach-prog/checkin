<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chùa Ảo 9 Sạch - Cảnh 3D + Avatar</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #e8c98a; letter-spacing: .3em; font-size: 12px; background: #050202; z-index: 5; }
  #hint { position: fixed; left: 10px; bottom: 8px; color: rgba(232,201,138,.45); font-size: 11px; z-index: 4; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="loading">ĐANG DỰNG CHÙA...</div>
<div id="hint">Phím 1/2/3: góc máy · A: thêm người xem · D: bớt · B: tất cả lạy · C: xoá hết · G: quà thường · H: quà hoa · M: tắt/bật nhạc · ?demo=40 · ?full=1 · ?debug=1</div>
<script>if (new URLSearchParams(location.search).get("hint") === "0") document.getElementById("hint").remove();</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
